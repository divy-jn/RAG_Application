            "spacing": {

                    "stack-lg": "32px",

<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .glass-panel {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
        }
        .bg-mesh {
            background-image: 
                radial-gradient(at 0% 0%, rgba(208, 188, 255, 0.08) 0, transparent 50%),
                radial-gradient(at 100% 100%, rgba(76, 215, 246, 0.08) 0, transparent 50%);
        }
        .hover-lift {
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }
        .hover-lift:hover {
            transform: translateY(-4px);
        }
    </style>
</head>
<body class="bg-background text-on-background font-body-md min-h-screen flex flex-col selection:bg-primary selection:text-on-primary-container bg-mesh">
<!-- TopAppBar is suppressed for Transactional Screen (Login) -->
<main class="flex-grow flex items-center justify-center px-margin-mobile py-stack-lg relative overflow-hidden">
<!-- Abstract Background Glows -->
<div class="absolute top-1/4 -left-20 w-64 h-64 bg-primary/10 rounded-full blur-[100px] pointer-events-none"></div>
<div class="absolute bottom-1/4 -right-20 w-64 h-64 bg-secondary/10 rounded-full blur-[100px] pointer-events-none"></div>
<div class="w-full max-w-[440px] flex flex-col items-center relative z-10">
<!-- Branding Header -->
<div class="mb-stack-lg flex flex-col items-center gap-4">
<img alt="StudyAI Logo" class="w-24 h-24 mb-2 drop-shadow-[0_0_15px_rgba(208,188,255,0.3)]" src="https://lh3.googleusercontent.com/aida/ADBb0ujdpEfB2jf1-cSEy9bAyQt_icHXVBDHap2BOv5Zzia0lssyihHsC1u1OcwbumSdWYzRzZOHL2XgRFgw4GzSQU7SHEGclj1WkPmxQS8Y4IUbbb-5GdDWdel75a2CLQ--OiDqCRKGHKgSZvonMEXlUbXtgPoQH0yB8Iufm7OGba3M65QBNSea_PqzLGm9QmisfDAA1d3-F6Vh1-dJ6PKWELZ9Z92Ts89dvYw6ixqibGKyH1tpB_Z3L14jUiU"/>
<h1 class="font-display-lg text-display-lg-mobile md:text-display-lg bg-gradient-to-r from-primary to-secondary bg-clip-text text-transparent">StudyAI</h1>
<p class="font-body-md text-text-secondary text-center">Elevate your learning with neural assistance.</p>
</div>
<!-- Login Glass Card -->
<div class="glass-panel w-full p-8 md:p-10 rounded-xl border border-border-subtle shadow-2xl flex flex-col gap-6">
<div class="space-y-1">
<h2 class="font-headline-sm text-headline-sm text-text-primary">Welcome Back</h2>
<p class="font-label-md text-label-md text-text-secondary opacity-70">Enter your credentials to continue.</p>
</div>
<form class="flex flex-col gap-5">
<!-- Email Field -->
<div class="flex flex-col gap-2">
<label class="font-label-md text-label-md text-on-surface-variant ml-1" for="email">Email Address</label>
<div class="relative group">
<span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-on-surface-variant group-focus-within:text-accent-cyan transition-colors">mail</span>
<input class="w-full bg-surface-container-lowest/30 border border-border-subtle rounded-lg py-4 pl-12 pr-4 text-text-primary placeholder:text-outline/50 focus:outline-none focus:border-accent-cyan focus:ring-1 focus:ring-accent-cyan transition-all duration-300" id="email" name="email" placeholder="alex@studyai.io" type="email"/>
</div>
</div>
<!-- Password Field -->
<div class="flex flex-col gap-2">
<div class="flex justify-between items-center px-1">
<label class="font-label-md text-label-md text-on-surface-variant" for="password">Password</label>
<a class="font-label-sm text-label-sm text-secondary hover:text-accent-cyan transition-colors" href="#">Forgot Password?</a>
</div>
<div class="relative group">
<span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-on-surface-variant group-focus-within:text-accent-cyan transition-colors">lock</span>
<input class="w-full bg-surface-container-lowest/30 border border-border-subtle rounded-lg py-4 pl-12 pr-12 text-text-primary placeholder:text-outline/50 focus:outline-none focus:border-accent-cyan focus:ring-1 focus:ring-accent-cyan transition-all duration-300" id="password" name="password" placeholder="••••••••" type="password"/>
<button class="absolute right-4 top-1/2 -translate-y-1/2 text-on-surface-variant hover:text-text-primary transition-colors" type="button">
<span class="material-symbols-outlined">visibility</span>
</button>
</div>
</div>
<!-- Remember Me Toggle -->
<div class="flex items-center gap-3 px-1 mt-1">
<input class="w-5 h-5 rounded border-border-subtle bg-surface-container-low text-primary focus:ring-offset-background focus:ring-primary" id="remember" type="checkbox"/>
<label class="font-label-md text-label-md text-on-surface-variant cursor-pointer" for="remember">Remember this session</label>
</div>
<!-- Sign In Button -->
<button class="mt-4 w-full bg-gradient-to-r from-primary-container to-secondary-container hover:from-primary hover:to-secondary text-on-primary-container font-headline-sm py-4 rounded-lg shadow-[0_0_20px_rgba(160,120,255,0.2)] hover:shadow-[0_0_30px_rgba(160,120,255,0.4)] hover-lift transition-all" type="submit">
                        Sign In
                    </button>
</form>
<!-- Divider -->
<div class="flex items-center gap-4 py-2">
<div class="h-px flex-grow bg-border-subtle"></div>
<span class="font-label-sm text-label-sm text-outline uppercase tracking-widest">or continue with</span>
<div class="h-px flex-grow bg-border-subtle"></div>
</div>
<!-- Social Logins -->
<div class="grid grid-cols-2 gap-4">
<button class="flex items-center justify-center gap-3 py-3 px-4 rounded-lg bg-surface-container/40 border border-border-subtle hover:bg-surface-container-high hover-lift transition-all">
<img alt="Google" class="w-5 h-5 grayscale opacity-70 group-hover:grayscale-0" src="https://lh3.googleusercontent.com/aida-public/AB6AXuBZPEu-jSjNSaSFnMXmkivjfJ0SqPKbM67qrGM39Cbz5iJAeirKMRsOjCfx4XCaDFCdN5eQwaNm4j5x4iE6-X9U8lTX5xC8s3YyBzo0JXmGcNslqaCeZl_wq6e0BvImCkngudM9k-W7ZQtHeL31THjA4dsXYL3k0Z2Auh1u9Rm32k687MeF_TF1HgXvQvoeS0QfNU0e4FVnV7TAUSr4vkSPgTevI3uXUNT5kLpRejQilZsoYpeFEbUmMksERknjUKwwHcIKV9hZuBg"/>
<span class="font-label-md text-label-md text-on-surface">Google</span>
</button>
<button class="flex items-center justify-center gap-3 py-3 px-4 rounded-lg bg-surface-container/40 border border-border-subtle hover:bg-surface-container-high hover-lift transition-all">
<span class="material-symbols-outlined text-[20px] text-on-surface">terminal</span>
<span class="font-label-md text-label-md text-on-surface">GitHub</span>
</button>
</div>
</div>
<!-- Footer Links -->
<p class="mt-8 font-body-md text-text-secondary">
                Don't have an account? 
                <a class="text-secondary font-semibold hover:text-accent-cyan hover:underline underline-offset-4 transition-all" href="#">Sign Up</a>
</p>
<div class="mt-12 flex gap-6 text-outline opacity-50 font-label-sm text-label-sm uppercase tracking-tighter">
<a class="hover:text-text-primary transition-colors" href="#">Privacy Policy</a>
<a class="hover:text-text-primary transition-colors" href="#">Terms of Service</a>
<a class="hover:text-text-primary transition-colors" href="#">Support</a>
</div>
</div>
</main>
<!-- BottomNavBar is suppressed for Transactional Screen (Login) -->
</body></html>
